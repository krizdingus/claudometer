[platformio]
default_envs = esp32dev

[env]
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -std=gnu++17
build_unflags = -std=gnu++11

[env:esp32dev]
platform = espressif32 @ ^6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
board_build.f_flash = 40000000L
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM=0
  -DLV_CONF_INCLUDE_SIMPLE
  -I .
  -I src
lib_deps =
  lovyan03/LovyanGFX@^1.1.16
  lvgl/lvgl@^9.1.0
  bblanchon/ArduinoJson@^7.0.4
  tzapu/WiFiManager@^2.0.17

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
  ${env.build_flags}
  -DUNIT_TEST
  -I src
  -I test/native
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
